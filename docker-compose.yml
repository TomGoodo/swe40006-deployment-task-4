services:
  web-app:
    image: tomgoodo/deployment-task-credit
    container_name: deployment-task-web
    expose:
      - "5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
    networks:
      - app-net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: flask-nginx
    depends_on:
      - web-app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge
